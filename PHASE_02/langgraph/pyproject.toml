[project]
name = "langchain-academy-env"
version = "0.1.0"
description = "LangGraph Academy course materials (uv-managed)"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
    "langgraph",
    "langgraph-prebuilt",
    "langgraph-sdk",
    "langgraph-checkpoint-sqlite",
    "langsmith>=0.7.31",
    "langchain-community",
    "langchain-core>=1.2.28",
    "langchain-openai>=1.1.14",
    "langchain-text-splitters>=1.1.2",
    "langchain-tavily",
    "notebook",
    "ipykernel>=7.1.0",
    "wikipedia",
    "trustcall",
    "langgraph-cli[inmem]",
    "aiohttp>=3.13.4",
    "Pygments>=2.20.0",
    "cryptography>=46.0.7",
]

[tool.uv]
package = false
